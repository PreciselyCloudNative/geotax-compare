name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: |
          python tests/test_unit_lib.py
          python tests/test_circuit_breaker.py
      - name: Notebooks compile
        run: python -m compileall -q src
